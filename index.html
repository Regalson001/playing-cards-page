<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page of Playing Cards</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="playing-cards">
      <!-- Card 1: Ace of Spades -->
      <div class="card spade">
        <div class="left">
          <span>A</span>
          <span>♠</span>
        </div>
        <div class="middle">
          <span>♠</span>
        </div>
        <div class="right">
          <span>A</span>
          <span>♠</span>
        </div>
      </div>

      <!-- Card 2: King of Hearts -->
      <div class="card heart">
        <div class="left">
          <span>K</span>
          <span>♥</span>
        </div>
        <div class="middle">
          <span>♥</span>
          <span>♥</span>
        </div>
        <div class="right">
          <span>K</span>
          <span>♥</span>
        </div>
      </div>

      <!-- Card 3: Queen of Diamonds -->
      <div class="card diamond">
        <div class="left">
          <span>Q</span>
          <span>♦</span>
        </div>
        <div class="middle">
          <span>♦</span>
          <span>♦</span>
          <span>♦</span>
        </div>
        <div class="right">
          <span>Q</span>
          <span>♦</span>
        </div>
      </div>
    </main>
  </body>
</html>
